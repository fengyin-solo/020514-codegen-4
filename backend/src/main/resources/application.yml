server:
  port: 8080
  servlet:
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/red_tourism?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

upload:
  path: ./uploads/

order:
  # 待取餐超时（分钟），超时未取自动作废并注明原因
  pickup-timeout-minutes: 30
